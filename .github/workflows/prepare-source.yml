name: Prepare reviewed source candidate

on:
  push:
    branches: [chore/open-source-hardening]
    paths: [.github/prepare_source.py, .github/workflows/prepare-source.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'fabiocnd/lpx-keepmorrow' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Apply the exact reviewed migration
        run: python .github/prepare_source.py
      - name: Regenerate policy and interface assets
        run: |
          python scripts/build_policy_assets.py
          npm --prefix ui/chatgpt ci --ignore-scripts
          npm --prefix ui/chatgpt run build
          npm --prefix ui/chatgpt test
      - name: Validate the complete Python service
        run: |
          python -m pip install -c requirements/chatgpt-dev-py312.constraints.txt '.[chatgpt]'
          python -m unittest discover -s tests -v
      - name: Commit only the validated source changes
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: Fabio de Sousa Lopes
          GIT_AUTHOR_EMAIL: fabio@lopixneural.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git rm .github/prepare_source.py
          git add --all
          git diff --cached --check
          git commit -m "Adopt Apache-2.0 and align source distribution contracts"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/chore/open-source-hardening
