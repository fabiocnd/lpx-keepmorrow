name: Private source review

on:
  push:
    branches: [chore/open-source-hardening]
    paths: [.github/workflows/source-review.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export tracked source without the Git database
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/keepmorrow-review-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/keepmorrow-review-revision.txt"
          git log --all --format= --name-only | sort -u > "$RUNNER_TEMP/keepmorrow-history-paths.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keepmorrow-private-source-review
          path: |
            ${{ runner.temp }}/keepmorrow-review-source.zip
            ${{ runner.temp }}/keepmorrow-review-revision.txt
            ${{ runner.temp }}/keepmorrow-history-paths.txt
          if-no-files-found: error
          retention-days: 1
