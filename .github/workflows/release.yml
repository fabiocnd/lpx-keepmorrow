name: Reviewed source release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write
  draft:
    if: github.event.repository.private == false
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify the version and reviewed branch ancestry
        run: |
          python scripts/check_public_source.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - name: Build licensed source and wheel distributions
        run: |
          python -m pip install 'setuptools==84.2.1'
          python -c "import setuptools.build_meta as b; b.build_sdist('dist'); b.build_wheel('dist')"
          git archive --format=zip --prefix=lpx-keepmorrow/ --output=dist/lpx-keepmorrow-source.zip HEAD
          cd dist
          sha256sum -- *.whl *.tar.gz *-source.zip > SHA256SUMS
      - name: Create a draft for human release review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease \
            --title "LPX Keepmorrow $RELEASE_TAG — experimental" --generate-notes
