name: Private Preservation Service

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate Python syntax
        run: python -m compileall -q src tests benchmarks
      - name: Run behavioral tests
        run: python -m unittest discover -s tests -v

  chatgpt-development:
    name: Authenticated service and MCP / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned development adapter
        run: python -m pip install -c requirements/chatgpt-dev-py312.constraints.txt '.[chatgpt]'
      - name: Validate the complete optional service and core
        run: python -m unittest discover -s tests -v
      - name: Verify canonical policy assets
        run: |
          python scripts/build_policy_assets.py
          git diff --exit-code -- src/keepmorrow/policies
      - name: Build the private wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Retain the private build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lpx-keepmorrow-private-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  chatgpt-interface:
    name: MCP Apps interface / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui/chatgpt
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/chatgpt/package-lock.json
      - name: Install the locked interface dependencies
        run: npm ci --ignore-scripts
      - name: Type-check, build, and verify bundled assets
        run: |
          npm run build
          git diff --exit-code -- ../../src/keepmorrow/integrations/chatgpt/assets THIRD-PARTY-NOTICES.txt
      - name: Test consent, interface, and official SDK behavior
        run: npm test
      - name: Install the supported test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise the synthetic browser host
        run: npm run test:browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keepmorrow-synthetic-browser-evidence
          path: ui/chatgpt/test-results/
          if-no-files-found: ignore
          retention-days: 14
