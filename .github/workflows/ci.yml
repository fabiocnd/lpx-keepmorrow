name: Continuous integration

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Keep branch-level cancellation within this service validation contract.
  # A stalled runner in the legacy core group must not retain its admission slot.
  group: preservation-service-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # These jobs preserve the standard-library core contract. Optional adapter
  # tests execute separately with their complete pinned dependency set.
  validation:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate Python syntax
        run: python -m compileall -q src tests benchmarks scripts
      - name: Run behavioral tests
        run: python -m unittest discover -s tests -v

  chatgpt-development:
    name: Authenticated service and MCP / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned development adapter
        run: python -m pip install -c requirements/chatgpt-dev-py312.constraints.txt '.[chatgpt]'
      - name: Validate the complete optional service and core
        run: python -m unittest discover -s tests -v
      - name: Exercise a fresh synthetic portal over HTTP
        run: |
          python -m keepmorrow.application.cli init "$RUNNER_TEMP/keepmorrow-http-pilot" --operator synthetic-pilot
          python tests/smoke/run_private_portal.py --configuration "$RUNNER_TEMP/keepmorrow-http-pilot/service.json" --launch-service > "$RUNNER_TEMP/keepmorrow-http-smoke.json"
          cat "$RUNNER_TEMP/keepmorrow-http-smoke.json"
      - name: Retain sanitized HTTP pilot evidence
        # Never upload the initialized instance, operator key, or state stores.
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keepmorrow-synthetic-http-evidence
          path: ${{ runner.temp }}/keepmorrow-http-smoke.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify canonical policy assets
        run: |
          python scripts/build_policy_assets.py
          git diff --exit-code -- src/keepmorrow/policies
      - name: Build the distributable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Retain the source build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lpx-keepmorrow-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  chatgpt-interface:
    name: MCP Apps interface / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui/chatgpt
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/chatgpt/package-lock.json
      - name: Install the locked interface dependencies
        run: npm ci --ignore-scripts
      - name: Type-check, build, and verify bundled assets
        run: |
          npm run build
          git diff --exit-code -- ../../src/keepmorrow/integrations/chatgpt/assets THIRD-PARTY-NOTICES.txt
      - name: Test consent, interface, and official SDK behavior
        run: npm test
      - name: Install the supported test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise the synthetic browser host
        run: npm run test:browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keepmorrow-synthetic-browser-evidence
          path: ui/chatgpt/test-results/
          if-no-files-found: ignore
          retention-days: 14

  source-contract:
    name: Source release contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/check_public_source.py
      - name: Export the checked source without Git history
        run: |
          python scripts/export_public_source.py "$RUNNER_TEMP/LPX-Keepmorrow-Source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keepmorrow-reviewed-source
          path: |
            ${{ runner.temp }}/LPX-Keepmorrow-Source.zip
            ${{ runner.temp }}/LPX-Keepmorrow-Source.zip.sha256
            ${{ runner.temp }}/source-revision.txt
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI required
    if: always()
    needs: [validation, chatgpt-development, chatgpt-interface, source-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CORE: ${{ needs.validation.result }}
      SERVICE: ${{ needs.chatgpt-development.result }}
      INTERFACE: ${{ needs.chatgpt-interface.result }}
      SOURCE: ${{ needs.source-contract.result }}
    steps:
      - name: Require every validation boundary to pass
        run: |
          test "$CORE" = success
          test "$SERVICE" = success
          test "$INTERFACE" = success
          test "$SOURCE" = success
