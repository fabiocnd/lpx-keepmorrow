name: Bug report
description: Report a reproducible problem using synthetic data only.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'Do not upload real exports, private conversations, credentials, or personal data. Report security vulnerabilities privately as described in SECURITY.md.'
  - type: input
    id: version
    attributes:
      label: Version or commit and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic data
      description: Include exact commands and a minimal artificial example.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: This report contains no real exports, credentials, or personal information.
          required: true
