[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lpx-keepmorrow"
version = "0.3.0"
description = "Verifiable preservation with scoped consent, durable operations, and a private ChatGPT integration"
requires-python = ">=3.11"
authors = [{name = "Fabio de Sousa Lopes", email = "fabio@lopixneural.com"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
# The preservation CLI needs only the standard library; network adapters opt in.
chatgpt = ["mcp==1.29.0", "PyJWT[crypto]==2.13.0", "cryptography==50.0.0", "httpx==0.28.1", "starlette==1.6.0", "uvicorn==0.52.1"]

[project.scripts]
keepmorrow = "keepmorrow.cli:main"
keepmorrow-service = "keepmorrow.application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keepmorrow = ["policies/*.md", "integrations/chatgpt/assets/*", "integrations/chatgpt/portal_assets/*"]

