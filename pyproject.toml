[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lpx-keepmorrow"
version = "0.2.0"
description = "Verifiable local archives, conversation history, and experimental ChatGPT export intake"
requires-python = ">=3.11"
authors = [{name = "Fabio de Sousa Lopes", email = "fabio@lopixneural.com"}]
license = {text = "Proprietary. Copyright 2026 Lopix Neural Inc. All rights reserved."}
dependencies = []

[project.optional-dependencies]
chatgpt = ["mcp==1.29.0"]

[project.scripts]
keepmorrow = "keepmorrow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

